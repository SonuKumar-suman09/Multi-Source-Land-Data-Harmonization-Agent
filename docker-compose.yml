services:
  db:
    build:
      context: ./database
      dockerfile: Dockerfile
    image: land-harmonizer-db:local
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-land_harmonizer}
      POSTGRES_USER: ${POSTGRES_USER:-land_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
